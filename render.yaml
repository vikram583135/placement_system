databases:
  - name: placement-db
    databaseName: placement
    user: placement_user

services:
  - type: web
    name: placement-system
    env: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn placement_system.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: placement-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 4
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DEBUG
        value: False
